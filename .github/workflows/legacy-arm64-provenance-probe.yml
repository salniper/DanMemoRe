name: One-shot pristine EU ARM64 provenance probe

on:
  pull_request:
    paths:
      - ".github/workflows/legacy-arm64-provenance-probe.yml"

permissions:
  contents: read

jobs:
  original-client-source-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Fetch candidate once, verify two fingerprints, scan ELF literals
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          local_dir="$(mktemp -d)"
          trap 'rm -rf "$local_dir"' EXIT
          candidate="$local_dir/pristine-original-arm64.xapk"

          # Third-party source, unauthenticated until BOTH the published archive
          # SHA-1 and independently pinned pristine ELF SHA-256 pass. The binary
          # never leaves this job, is not uploaded and is never executed.
          if ! curl -fLsS --retry 1 --retry-delay 2 --connect-timeout 15 \
               --max-time 120 --max-filesize 268435456 \
               --proto '=https' --tlsv1.2 \
               -o "$candidate" \
               'https://d.apkpure.net/b/XAPK/com.eu.danmemo?nc=&sv=19&versionCode=170316722'; then
            echo "SOURCE_UNAVAILABLE: original ARM64 archive could not be fetched." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if ! python3 tools/verify_pristine_arm64_xapk.py \
               --xapk "$candidate" --scan --context --sections > "$local_dir/report.json"; then
            echo "CANDIDATE_REJECTED: pinned original archive/native hashes or structure did not validate." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Source content search is read-only. Every candidate must match
          # the reference asset MD5 AND size; names alone prove nothing.
          python3 tools/audit_original_xapk_asset_candidates.py \
            --xapk "$candidate" > "$local_dir/asset_candidates.json"

          python3 - "$local_dir/asset_candidates.json" <<'PY'
          import json, sys, os
          with open(sys.argv[1], encoding="utf-8") as source:
              audit = json.load(source)
          print("original_xapk_nested_apks=" + str(audit["nested_apk_count"]))
          print("reference_exact_asset_targets_in_original_xapk=" +
                str(audit["reference_exact_target_count"]))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("Exact legacy asset candidates in authenticated original EU XAPK: " +
                            str(audit["reference_exact_target_count"]) + " / 12.\n")
          for path, record in audit["targets"].items():
              if record["basename_occurrences"]:
                  print("original_xapk_asset_candidate=" + json.dumps({
                      "path": path,
                      "basename_occurrences": record["basename_occurrences"],
                      "wrong_size_occurrences": record["wrong_size_occurrences"],
                      "same_size_nonmatching_occurrences":
                          record["same_size_nonmatching_occurrences"],
                      "reference_exact_occurrences":
                          record["reference_exact_occurrences"],
                      "reference_exact_locations": record["reference_exact_locations"],
                  }, sort_keys=True))
          PY

          # Independently SHA-pin the source, then search only ELF .text
          # for references to the *start* of original novel source-path labels.
          # Report function/class metadata and instruction offsets only.
          python3 tools/probe_pristine_novel_dispatch.py \
            --xapk "$candidate" > "$local_dir/novel_dispatch_seeds.json"

          python3 - "$local_dir/novel_dispatch_seeds.json" <<'PY'
          import json, sys, os
          with open(sys.argv[1], encoding="utf-8") as source:
              report = json.load(source)
          print("novel_metadata_labels=" + str(report["original_source_labels_checked"]))
          print("novel_metadata_executable_ref_targets=" +
                str(report["code_referenced_original_labels"]))
          print("novel_metadata_executable_ref_sites=" +
                str(report["code_site_candidates"]))
          print("native_dispatch_opcode_mappings_verified=" +
                str(report["numeric_opcode_to_handler_mappings_verified"]))
          print("original_unwind_sections=" +
                json.dumps(report["original_unwind_section_evidence"],sort_keys=True))
          executor=report["original_executor_neighborhoods"]
          print("native_createNovel_source_anchored_sites=" +
                str(executor["executor_site_count"]))
          print("native_createNovel_dispatch_mapping_proven=" +
                str(executor["native_opcode_handler_mapping_count"]))
          unwind = report["original_executor_unwind_frames"]
          print("original_unwind_fde_index_entries=" + str(unwind["fde_index_entries"]))
          print("original_executor_unwind_covered_anchors=" +
                str(unwind["exact_fde_coverage_count"]))
          exact_region=report["original_executor_cfi_region_code"]
          print("original_executor_unique_fde_regions=" +
                str(exact_region["distinct_verified_unwind_regions"]))
          print("original_executor_cfi_opcode_handler_pairs=" +
                str(exact_region["verified_numeric_opcode_handler_pairs"]))
          callees=report["original_executor_direct_callees"]
          print("novel_executor_original_BL_sites="+str(callees["original_caller_direct_bl_sites"]))
          print("novel_executor_unique_BL_targets="+str(callees["unique_direct_bl_targets"]))
          print("novel_executor_BL_target_fde_statuses="+
                json.dumps(callees["callee_fde_status_totals"],sort_keys=True))
          print("novel_executor_verified_opcode_handler_links="+
                str(callees["numeric_opcode_to_native_handler_proven"]))
          two_hop=report["original_executor_two_hop_novel_cpp_candidates"]
          print("original_novel_second_hop_BL_sites="+
                str(two_hop["total_second_hop_bl_sites"]))
          print("original_novel_second_hop_unique_targets="+
                str(two_hop["distinct_second_hop_targets"]))
          print("original_novel_second_hop_fde_statuses="+
                json.dumps(two_hop["second_hop_target_fde_status_counts"],sort_keys=True))
          print("original_novel_second_hop_native_cpp_matches="+
                str(two_hop["candidate_callees_with_handler_source_cpp"]))
          print("original_novel_second_hop_verified_opcode_mappings="+
                str(two_hop["numeric_opcode_to_native_handler_mappings_verified"]))
          for region in two_hop["firsthop_regions"]:
              print("original_novel_second_hop_region="+json.dumps({
                  "firsthop_start":region["firsthop_fde_start_va"],
                  "second_hop_bl_sites":region["second_hop_bl_sites"],
                  "second_hop_distinct_targets":region["second_hop_distinct_targets"],
                  "handler_cpp_candidate_callee_count":
                    region["target_functions_with_novel_handler_cpp_labels"],
                  "handler_cpp_candidate_samples":region["handler_source_candidates"][:18],
              },sort_keys=True))
          second_hop=report["original_executor_direct_callee_code_shapes"]
          print("original_novel_unique_callee_code_regions="+
                str(second_hop["verified_callee_fde_regions"]))
          print("original_novel_second_hop_verified_handler_maps="+
                str(second_hop["numeric_opcode_handler_mappings_proven"]))
          for region in second_hop["callee_regions"]:
              print("original_novel_callee_code_shape="+json.dumps({
                  "fde_start_va":region["fde_start_va"],
                  "fde_end_va":region["fde_end_va_exclusive"],
                  "instructions":region["instruction_word_count"],
                  "instruction_counts":region["instruction_class_counts"],
                  "immediate_comparisons":region["small_immediate_cmp_histogram"],
                  "overlapping_story_opcode_constants":
                    region["observed_story_opcode_values_also_present_as_cmp_immediates"],
                  "distinct_second_hop_BL_targets":
                    region["unique_second_hop_direct_call_targets"],
                  "second_hop_BL_count":region["second_hop_direct_call_count"],
                  "second_hop_sample":region["second_hop_direct_call_sample"][:12]
              },sort_keys=True))
          for target in callees["callees"]:
              print("novel_executor_original_BL_target="+json.dumps({
                  "target_va":target["target_va"],
                  "inbound_call_count":target["source_call_count"],
                  "unwind_status":target["fde_status"],
                  "fde_start":target["unwind_start_va"],
                  "fde_end_exclusive":target["unwind_end_va_exclusive"],
                  "is_fde_entry":target["target_is_fde_entry"],
                  "novel_label_candidates_in_same_fde":
                    target["novel_source_label_candidates_in_same_fde"],
                  "label_candidate_samples":target["novel_source_label_samples"][:5],
              },sort_keys=True))
          for region in exact_region["regions"]:
              print("original_executor_precise_region=" + json.dumps({
                  "unwind_start_va": region["validated_unwind_start_va"],
                  "unwind_end_va_exclusive": region["validated_unwind_end_va_exclusive"],
                  "instruction_word_count": region["instruction_word_count"],
                  "instruction_class_counts": region["instruction_class_counts"],
                  "immediate_comparisons_up_to_256": region["immediate_comparisons_up_to_256"],
                  "direct_call_count": region["direct_call_count"],
                  "direct_call_sites": region["direct_call_sites"][:60],
                  "indirect_sites": region["indirect_call_or_branch_sites"],
                  "branches_within_region": region["branches_within_region"],
                  "branches_outside_region": region["branches_outside_region"],
              },sort_keys=True))
          for row in unwind["sites"]:
              print("original_executor_cfi_site=" + json.dumps(row,sort_keys=True))
          for site in executor.get("sites", [])[:8]:
              print("native_createNovel_code_neighborhood=" + json.dumps({
                  "source_anchor_offset":site["anchor_file_offset"],
                  "instruction_classes":site["instruction_classes"],
                  "small_immediate_comparisons":site["small_immediate_cmp_histogram"],
                  "bounded_control_flow_events":site["bounded_control_flow_events"][:8],
              },sort_keys=True))
          for row in report["candidate_referenced_labels"][:30]:
              print("native_novel_code_reference=" + json.dumps({
                  "kind": row["kind"],
                  "label": row["original_label"],
                  "instruction_sites": row["instruction_sites"][:8],
                  "sites_truncated": row["instruction_site_count"] > 8
              }, sort_keys=True))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write("Original novel ELF .text label-reference candidates: " +
                        str(report["code_site_candidates"]) +
                        ". No numeric opcode/handler mapping verified.\n")
          PY

          python3 - "$local_dir/report.json" <<'PY'
          import json, sys, os
          with open(sys.argv[1], encoding="utf-8") as source:
              report = json.load(source)
          scan = report["story_address_candidates"]
          print("ORIGINAL_ARM64_VERIFIED")
          print("pristine_native_sha256=" + report["native_sha256"])
          print("novel_marker_literal_total=" + str(sum(row["literal_hits"] for row in scan["markers"])))
          print("elf_code_gate=" + scan["scan_scope"])
          print("excluded_data_adr_bit_patterns=" + str(scan["excluded_noncode_arithmetic_matches"]))
          # Print only bounded code-location metadata; never original native bytes.
          for row in scan["markers"]:
              print("marker_count=" + row["marker"] + ":" + str(row["literal_hits"]))
              for location in row["locations"]:
                  refs = location.get("address_references")
                  if not refs or refs["candidate_count"] == 0:
                      continue
                  print("literal_reference=" + json.dumps({
                      "marker": row["marker"],
                      "literal_file_offset": location["file_offset"],
                      "literal_virtual_address": location["virtual_address"],
                      "candidate_count": refs["candidate_count"],
                      "candidates": refs["candidates"],
                      "truncated": refs["truncated"],
                  }, separators=(",", ":"), sort_keys=True))
          # Bounded, metadata-only nearby function/call classification.
          # No source code bytes, disassembly instructions, key material or data.
          code_context = report["story_code_context"]
          print("native_context_status=" + code_context["status"])
          print("native_context_site_count=" + str(code_context["candidate_site_count"]))
          elf = report["story_elf_sections"]
          print("elf_section_table_present=" + str(elf["section_table_present"]))
          print("elf_section_count=" + str(elf["section_count"]))
          sym = elf["named_symbols"]
          print("elf_symbols_examined=" + str(sym["symbols_checked"]))
          print("novel_named_symbols=" + str(sym["matching_symbol_count"]))
          print("novel_named_symbol_types=" + json.dumps(sym["matching_symbol_types"], sort_keys=True))
          for sample in sym["matching_symbol_samples"]:
              print("novel_named_symbol_sample=" + json.dumps(sample, sort_keys=True))
          for site in elf["candidate_locations"]:
              print("elf_candidate_section=" + json.dumps(site, sort_keys=True))
          for site in code_context["sites"]:
              print("native_context_site=" + json.dumps({
                  "marker": site["marker"],
                  "literal_form": site["literal_form"],
                  "xref_file_offset": site["xref_file_offset"],
                  "xref_pattern": site["xref_pattern"],
                  "possible_frame_start_offset": site["possible_frame_start_offset"],
                  "first_following_return_offset": site["first_following_return_offset"],
                  "window_control_flow_event_count": site["window_control_flow_event_count"],
                  "window_control_flow_events": site["window_control_flow_events"],
                  "window_events_truncated": site["window_events_truncated"],
              }, separators=(",", ":"), sort_keys=True))
          print("novel_marker_address_candidates_total=" + str(sum(
              entry["address_references"]["candidate_count"]
              for row in scan["markers"]
              for entry in row["locations"]
              if entry.get("address_references")
          )))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("PINNED_ARM64_VERIFIED: pristine source binary SHA-256 matched. "
                            "Literal references are **not** loader/decryptor proof; "
                            "12 legacy mismatches remain blocked.\n")
          PY
