name: Legacy Import policy

on:
  pull_request:
    paths:
      - ".github/workflows/legacy-import-policy.yml"
      - "tools/legacy-policy-ci/**"
      - "tools/test_legacy_import_policy.kt"
      - "tools/recover_legacy_apk_assets.py"
      - "tools/test_recover_legacy_apk_assets.py"
      - "tools/inspect_legacy_mismatches.py"
      - "tools/test_inspect_legacy_mismatches.py"
      - "tools/repair_verified_phase_manifests.py"
      - "tools/test_repair_verified_phase_manifests.py"
      - "tools/inspect_master_source_provenance.py"
      - "tools/test_inspect_master_source_provenance.py"
      - "android/danmemore-launcher/app/src/main/kotlin/dev/danmemore/launcher/LegacyImportPolicy.kt"

permissions:
  contents: read

jobs:
  jvm-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up isolated Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Compile and run pure Kotlin policy checks
        run: gradle -p tools/legacy-policy-ci run --no-daemon --stacktrace

  apk-recovery-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Test safe offline APK recovery and mismatch inspection
        run: |
          python3 -m unittest discover -s tools -p 'test_recover_legacy_apk_assets.py' -v
          python3 -m unittest discover -s tools -p 'test_inspect_legacy_mismatches.py' -v
          python3 -m unittest discover -s tools -p 'test_repair_verified_phase_manifests.py' -v

  master-provenance:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify source metadata parser with synthetic fixtures
        run: python3 -m unittest discover -s tools -p 'test_inspect_master_source_provenance.py' -v
      - name: Compare recorded EU master source fingerprints
        run: python3 tools/inspect_master_source_provenance.py --master data/danmemore-master.json
