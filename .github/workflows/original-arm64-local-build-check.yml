name: Original ARM64 Client Local-Build Verification

on:
  pull_request:
    paths:
      - ".github/workflows/original-arm64-local-build-check.yml"
      - "tools/build_original_arm64_local.py"
      - "tools/test_build_original_arm64_local.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safety-regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Test original-only build source gating with synthetic XAPKs
        run: python3 -m unittest discover -s tools -p 'test_build_original_arm64_local.py' -v

  transient-original-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: safety-regression
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Check installed Android SDK build tools
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_HOME:-}"
          if [ ! -f "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" ]; then
            sdkmanager "build-tools;35.0.0"
          fi
          test -f "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar"
      - name: Verify original source and build temporary private splits
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          local_dir="$(mktemp -d)"
          trap 'rm -rf "$local_dir" .work/original-arm64-signing' EXIT
          mkdir -p .work
          archive="$local_dir/pristine-arm64.xapk"
          # The source is outside Git, never published in workflow artifacts.
          if ! curl -fLsS --retry 1 --retry-delay 2 --connect-timeout 15                 --max-time 120 --max-filesize 268435456                 --proto '=https' --tlsv1.2                 -o "$archive"                 'https://d.apkpure.net/b/XAPK/com.eu.danmemo?nc=&sv=19&versionCode=170316722'; then
             echo "SOURCE_UNAVAILABLE: Could not obtain pinned original client" >> "$GITHUB_STEP_SUMMARY"
             exit 0
          fi
          python3 tools/build_original_arm64_local.py --xapk "$archive" --verify-only             > "$local_dir/verified-source.json"
          python3 tools/build_original_arm64_local.py --xapk "$archive"             --output-dir "$local_dir/signed-apks" > "$local_dir/build-metadata.json"
          python3 - "$local_dir/build-metadata.json" <<'PY'
          import json,os,sys
          with open(sys.argv[1]) as f: result=json.load(f)
          assert result["status"]=="ORIGINAL_CLIENT_SPLIT_BUILD_COMPLETE_NOT_PLAYABILITY_PROOF"
          assert len(result["signed_split_apks"])==6
          assert result["outstanding_reference_mismatches"]==12
          assert result["ayn_thor_runtime_verified"] is False
          assert result["requires_verified_owner_content_archive"] is True
          print("original_arm64_signed_split_count="+str(len(result["signed_split_apks"])))
          print("original_arm64_split_names="+
                ",".join(x["split"] for x in result["signed_split_apks"]))
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as out:
              out.write("Pinned original ARM64 split signing: **6/6** passed. "
                        "This is NOT a playable-client test. "
                        "No proprietary APK outputs were uploaded.\n")
          PY
          # No upload-artifact step. Runner gets torn down; original is never
          # redistributed and keystore/password stay ephemeral.
